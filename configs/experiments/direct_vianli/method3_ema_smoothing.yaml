project:
  experiment_id: EXP-001-FINAL-SOTA
  experiment_name: exp001-direct-vianli-final-sota-batch
  method_name: Gated-Dual CafeBERT + Multi-Sample Dropout + Parameter EMA (Final SOTA
    Batch)
  seed: 42
  target_test_locked: false
model:
  name: uitnlp/CafeBERT
  revision: af76fcf2a04096b2b54b348a3e4eb48253c93c5d
  max_length: 512
  dropout: 0.1
  label_smoothing: 0.02
  pool_mode: gated_dual
  segment_pooling: attentive
  relation_hidden: 128
  gate_bias: -1.0
data:
  vianli_dir: data/processed/vianli_clean
  max_lengths:
    vianli: 512
training:
  physical_batch_size: 4
  gradient_accumulation_steps: 4
  effective_batch_size: 16
  bf16_train: true
  fp16_train: false
  fp32_eval: true
  learning_rate: 1.0e-05
  weight_decay: 0.005
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  max_epochs: 7
  eval_optimizer_steps: 50
  early_stopping_patience_evals: 4
experiments:
- id: m3_final_cfg1_ema_992_lr10
