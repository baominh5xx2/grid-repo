[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-dual-ema-msd"
version = "0.1.0"
description = "Vietnamese NLI training and evaluation with Gated-Dual CafeBERT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "transformers>=4.38.0",
  "datasets>=2.18.0",
  "accelerate>=0.28.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
tracking = ["wandb>=0.16.4", "huggingface_hub>=0.21.0", "python-dotenv>=1.0.1"]

[project.scripts]
nli-train = "gated_dual_ema_msd.cli.train:main"
nli-matrix = "gated_dual_ema_msd.cli.matrix:main"
nli-evaluate = "gated_dual_ema_msd.cli.evaluate:main"
nli-r2 = "gated_dual_ema_msd.cli.r2:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gated_dual_ema_msd*"]
